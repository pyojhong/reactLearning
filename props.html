<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Props</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const Btn = (props) => {
            // Btn = ({customText}) => {} 이러한 형태로 더 자주 쓰인다.
            return (
                <button style={{
                    backgroundColor: "tomato",
                    color: "white",
                    padding: "10px 20px",
                    border: 0, 
                    borderRadius: 10,
                }}>{props.customText}</button>
            );
        };
        const App = () => {
            return (
                    // 내가 만든 함수이기 때문에 인자를 내 마음대로 받을 수 있게 한다.
                    // 따라서 customText는 내가 만든 값이고, 이를 저장하기 위해서는 Btn 함수를 불러오는 식과 동일하다.
                    // Btn({customText: "저장"}) 의 식으로 전달한다.
                <div>
                    <Btn customText="저장"/>
                    <Btn customText="확인"/>
                </div>
            );
        };
        const root = document.getElementById('root');
        ReactDOM.render(<App />, root);
    </script>
</body>
</html>
